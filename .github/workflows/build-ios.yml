name: Build IntelliBike iOS IPA

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build iOS IPA
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Build Next.js Static Site
        run: npm run build

      - name: Sync Capacitor iOS
        run: |
          if [ ! -d "ios" ]; then
            npx cap add ios
          fi
          npx cap sync ios
          # Ensure any Windows backslashes in Package.swift are converted to forward slashes for macOS
          if [ -f "ios/App/CapApp-SPM/Package.swift" ]; then
            sed -i '' 's/\\/\//g' ios/App/CapApp-SPM/Package.swift || sed -i 's/\\/\//g' ios/App/CapApp-SPM/Package.swift || true
          fi

      - name: Build iOS App with Xcode (Ad-Hoc Signing)
        run: |
          cd ios/App
          xcodebuild clean build \
            -project App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath ../../build-output \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=YES \
            PROVISIONING_PROFILE_SPECIFIER="" \
            DEVELOPMENT_TEAM=""

      - name: Package .IPA File
        run: |
          APP_PATH=$(find build-output -name "App.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "Error: App.app not found in build-output"
            exit 1
          fi
          echo "Found compiled app at: $APP_PATH"
          mkdir -p ipa-package/Payload
          cp -r "$APP_PATH" ipa-package/Payload/
          cd ipa-package
          zip -qr IntelliBike.ipa Payload

      - name: Upload iOS IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: IntelliBike-iOS-IPA
          path: ipa-package/IntelliBike.ipa
